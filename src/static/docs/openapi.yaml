                                type: object
                                properties:
                                  type:
                                    type: string
                                    example: "1"
                                  coverage:
                                    type: string
                                    example: "1-50"
                                  date:
                                    type: string
                                    format: date-time
                                    example: "2026-03-31T00:00:00"
                                  value:
                                    type: number
                                    example: 1.0
