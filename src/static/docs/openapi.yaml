          schema:
            type: string
        - name: from_date
          in: query
          required: false
          description: Optional filter date in YYYY-MM-DDThh:mm:ssZ format (2025-01-01T00:00:00Z)
          schema:
            type: string
        - name: data_type
          in: query
          required: false
