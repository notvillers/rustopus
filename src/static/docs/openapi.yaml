openapi: 3.0.3
info:
  title: RustOpus XML API
  version: 1.0.0
  description: Get Octopus 8 ERP SOAP XML with english tags instead of hungarians

paths:
  /get-product:
    get:
      summary: Get product data
      description: Returns basic data for the products.
      tags:
        - Products
      parameters:
        - name: url
          in: query
          required: true
          description: >-
            Endpoint URL with the ```.asmx``` file. Must point at a host this
            deployment allows (`[server] allowed_soap_hosts` in `Config.toml`,
            defaulting to the host of the configured `soap.json` url); any other
            host is refused with error `205 Url not allowed`. Omit the parameter
            to use the server's configured default.
          schema:
            type: string
        - name: authcode
          in: query
          required: true
          description: Authorization code
          schema:
            type: string
        - name: xmlns
          in: query
          required: false
          description: Optional XML namespace
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Optional language (only supports `HU`)
          schema:
            type: string
      responses:
        '200':
          description: XML product list
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProductResponse'

