[workspace]
members = ["client"]

[package]
name = "rustopus"
version = "1.2.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
cc = "1.0"

[dependencies]
config = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "http2"] }
actix-web = "4"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.3", features = ["v4"] }
quick-xml = { version = "0.31", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
log = "0.4"
flexi_logger = "0.27"
once_cell = "1.18"
lazy_static = "1.4"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt"] }
csv = "1.4.0"
regex = "1.12.3"
macro_rules_attribute = "0.2.2"
rust_xlsxwriter = { version = "0.96.0", features = ["serde"] }
rmcp-actix-web = "0.12"
rmcp = { version = "1", features = ["server", "macros"] }
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
# base64url for the OAuth PKCE comparison. A security boundary is the wrong
# place to reuse the hand-rolled standard-alphabet decoder in mcp/admin.rs.
base64 = "0.22"
toml = "0.8"
# Real URL parsing for the outbound-host allowlist in `service/soap_config.rs`.
# Already in the tree through reqwest; a hand-rolled host extractor on a security
# boundary is how an allowlist gets walked past.
url = "2"
flate2 = "1"

# Optimize dependencies even in dev builds, while our own crate stays at
# opt-level 0 so it compiles fast and debugs cleanly. Without this, the pure-Rust
# deflate backend behind `flate2` (miniz_oxide) and `serde_json` run unoptimized,
# and writing one ~46 MB catalog snapshot to `mcp_cache/` takes minutes instead
# of seconds — slow enough to look like a hang rather than a slow build.
[profile.dev.package."*"]
opt-level = 3
