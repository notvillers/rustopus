[server]
host = "0.0.0.0"
port = 1140
timeout = 1200
workers = 2
# Max concurrent outbound SOAP calls; extra requests wait. Optional, default 4.
soap_concurrency = 4

# MCP endpoint (/mcp) + admin dashboard (/admin). Every key is optional, and
# `enabled` defaults to false: with it off, no MCP route is registered, no
# precache task is spawned and no cache memory is held. Turn it on only in the
# dedicated MCP instance — a large cache inside the process serving the live API
# would let an OOM take down /get-product for every existing consumer.
[mcp]
enabled = true
# In-MEMORY cache budget in bytes.
#
# 0 disables the memory tier entirely: every query loads from the disk store
# below. Measured on the real catalog (24,344 products, release build), that
# costs ~90 ms per tool call and keeps the process at ~12 MB idle instead of
# ~103 MB — the right trade on a 1-1.5 GB host, where a predictable footprint
# beats shaving a tenth of a second off a chat response.
#
# Raise it to hold snapshots resident instead. Budget for one snapshot per ~46 MB,
# and leave room for the actix server, for the peak of a build (the raw ~46 MB XML
# plus the structures parsed from it, alive at once), and for moka's asynchronous
# eviction, which lets the cache briefly overshoot its cap. Nothing is ever lost
# past this budget — snapshots fall through to disk.
max_bytes = 0
# Where snapshots are mirrored on disk. Relative paths resolve against the
# working directory, like soap.json and log/. SECRET-GRADE: these files hold a
# partner's own negotiated prices, so they are written 0600 in a 0700 directory.
disk_path = "mcp_cache"
# On-disk budget in bytes. Stored snapshots are gzipped, so this holds far more
# combinations than the figure suggests.
disk_max_bytes = 5_000_000_000
# Where generated Excel/CSV exports are written before download. SECRET-GRADE
# for the same reason as mcp_cache: an export holds a partner's own prices.
export_path = "mcp_exports"
# How long a download link stays valid, in seconds. Default 3600 (1 hour).
export_ttl_secs = 3600
# Base URL used to build export download links. MUST be set to the hostname
# colleagues' browsers can reach — the MCP transport gives a tool no view of the
# request's Host header, so it cannot be derived. The default below only works
# for local testing.
public_url = "http://localhost:1140"
# How long a catalog snapshot stays valid. Default 21600 (6 hours).
ttl_secs = 21600
# How often the precache sweep runs. Default 3600 (1 hour).
precache_interval_secs = 3600
# OAuth 2.1 for /mcp. Off by default: with it off no metadata document and no
# /oauth route is registered, and /mcp keeps identifying its caller from the
# X-Authcode / X-Pid headers exactly as before.
#
# Turn it on for the claude.ai custom connector, which has no field for a custom
# header and can only authenticate through OAuth. See MCP_OAUTH_PLAN.md.
# Requires [mcp] enabled = true and a public_url the connector can reach over
# https — every URL in the metadata documents is built from it.
#
# NOTE: tests/get_test.rs spawns the real binary against this file, so leave this
# false in the committed configuration.
oauth_enabled = true
# Keep serving X-Authcode / X-Pid callers once OAuth is on. Default true, which
# is what lets mcp-remote, curl and existing integrations work through the
# transition; a request with no credentials still gets the 401 the connector
# needs. Turn it off once every caller has migrated.
oauth_allow_headers = true
# Registered connectors. Secrets are stored hashed and shown once, so this is not
# a credential file — it is still written 0600.
oauth_clients_path = "oauth_clients.toml"
# Issued sign-ins. SECRET-GRADE: each grant holds a partner's Octopus authcode in
# plain text, because the tools present it to Octopus with no user in the loop.
oauth_sessions_path = "oauth_sessions.toml"
# Access-token lifetime in seconds. Default 3600. Access tokens live in memory
# only, so a restart drops them and clients silently refresh.
oauth_access_ttl_secs = 3600
# Refresh-token lifetime in seconds. Default 2592000 (30 days). Past this the
# partner signs in again through the connector.
oauth_refresh_ttl_secs = 2592000
# Failed sign-ins allowed per IP per 10 minutes. Default 10. Without a limit the
# sign-in form is an oracle for guessing authcodes against the ERP.
oauth_login_rate_limit = 10
# Admin dashboard token. Prefer the RUSTOPUS_ADMIN_TOKEN environment variable —
# this file is tracked in git, so a token written here gets committed. With
# neither set, /admin is not registered at all.
admin_token = ""
